name: Windows checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
      - name: Formatting, modules and static checks
        shell: pwsh
        run: |
          $files = gofmt -l (Get-ChildItem -Filter *.go -File).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($files) { throw "Run gofmt on: $files" }
          go mod verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test real NTFS file operations and encryption
        run: go test -count=1 -v ./...
      - name: Check reachable dependencies for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build portable release
        run: ./scripts/build.ps1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
      - run: ./scripts/build.ps1
      - name: Publish versioned download
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create $env:RELEASE_TAG dist/File-Lock-windows-x64.zip dist/SHA256SUMS.txt --verify-tag --title "File Lock $env:RELEASE_TAG" --notes-file CHANGELOG.md
